server:
  port: 8081

spring:
  application:
    name: loh-user-tenant

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true 必须加：MySQL8 默认 caching_sha2_password，不加直接连不上
    url: "jdbc:mysql://106.14.90.100:3306/let_out_house?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true"
    username: ${LOH_DB_USER:loh_app}
    password: ${LOH_DB_PASSWORD:666666}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  # Boot3 前缀是 spring.data.redis，不是 spring.redis，写错会静默连默认地址
  data:
    redis:
      host: 106.14.90.100
      port: 6379
      password: ${LOH_REDIS_PASSWORD:666666}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

loh:
  jwt:
    secret: ${LOH_JWT_SECRET:12345678abcdefgh12345678abcdefgh}
    expire-minutes: 120

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前必须删掉这一行
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 配合建表时的 deleted BIGINT 设计：删除时写入自身 id，唯一键才不会撞
      logic-delete-field: deleted
      logic-delete-value: id
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lethouse: debug
