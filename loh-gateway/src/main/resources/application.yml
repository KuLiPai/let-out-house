server:
  port: 8080

loh:
  jwt:
    secret: ${LOH_JWT_SECRET:12345678abcdefgh12345678abcdefgh}
    expire-minutes: 120


spring:
  application:
    name: loh-gateway
  cloud:
    gateway:
      # 路由规则等 Python 三服务起来后再补，这里先保持空
      discovery:
        locator:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lethouse: debug
